[project]
name = "folio"
version = "0.1.0"
description = "Organize AI-assisted work around durable work items (Markdown), not around individual Claude Code sessions."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
folio = "folio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["folio"]

[tool.setuptools.package-data]
folio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
